<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тест на особенности характера</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f5f7;margin:0;color:#202124}
.wrap{max-width:700px;margin:30px auto;padding:16px}
.card{background:white;border-radius:18px;padding:24px;box-shadow:0 4px 18px #0001}
h1{font-size:25px;margin-top:0}
.q{border-top:1px solid #eee;padding:18px 0}
.q p{font-weight:600;line-height:1.4}
label{display:block;padding:9px 0;cursor:pointer}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#222;color:#fff;font-size:16px;cursor:pointer}
.result{margin-top:20px;padding:18px;border-radius:14px;background:#f0f2f5;display:none}
.small{color:#666;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>Тест на особенности характера</h1>
<p class="small">24 вопроса. Выбирай ответ, который лучше всего описывает тебя в обычной жизни. Это авторский ознакомительный тест, а не медицинская диагностика.</p>
<form id="test"></form>
<button onclick="finish()">Получить результат</button>
<div id="result" class="result"></div>
</div></div>
<script>
const qs=[
["Тебе легко знакомиться с новыми людьми?","Общительность"],["Ты часто стремишься быть в центре внимания?","Демонстративность"],
["Ты обычно спокойно воспринимаешь критику?","Устойчивость"],["Ты долго переживаешь из-за неприятных событий?","Чувствительность"],
["Если поставил цель, тебе трудно остановиться, пока не добьёшься её?","Настойчивость"],
["Ты быстро меняешь настроение?","Эмоциональность"],
["Тебе нравится выступать перед другими?","Демонстративность"],
["Ты предпочитаешь сначала подумать, а потом действовать?","Устойчивость"],
["Ты легко начинаешь разговор с незнакомым человеком?","Общительность"],
["Ты часто принимаешь близко к сердцу слова других?","Чувствительность"],
["Если кто-то спорит с тобой, тебе хочется доказать свою правоту?","Настойчивость"],
["Тебе легко скрывать свои эмоции?","Устойчивость"],
["Ты любишь большое количество общения и компаний?","Общительность"],
["Ты можешь резко расстроиться из-за мелочи?","Эмоциональность"],
["Тебе нравится, когда тебя замечают и хвалят?","Демонстративность"],
["После конфликта ты долго прокручиваешь ситуацию в голове?","Чувствительность"],
["Ты умеешь доводить начатое до конца?","Настойчивость"],
["Ты обычно сохраняешь спокойствие в напряжённой ситуации?","Устойчивость"],
["Ты часто рассказываешь другим о своих достижениях?","Демонстративность"],
["Ты быстро привыкаешь к новым людям и обстановке?","Общительность"],
["Тебя легко ранить грубым словом?","Чувствительность"],
["Если решил что-то сделать, мнение других редко тебя останавливает?","Настойчивость"],
["Твоё настроение заметно влияет на твоё поведение?","Эмоциональность"],
["Ты можешь спокойно провести много времени один?","Устойчивость"]
];
const f=document.getElementById("test");
qs.forEach((q,i)=>{f.innerHTML+=`<div class="q"><p>${i+1}. ${q[0]}</p><label><input required type="radio" name="q${i}" value="1"> Да</label><label><input type="radio" name="q${i}" value="0"> Нет</label></div>`});
function finish(){
 let s={}; qs.forEach(q=>s[q[1]]=(s[q[1]]||0));
 qs.forEach((q,i)=>{let a=document.querySelector(`input[name=q${i}]:checked`);if(!a){alert("Ответь на все вопросы.");return;}s[q[1]]+=+a.value});
 let best=Object.entries(s).sort((a,b)=>b[1]-a[1]);
 let names={"Общительность":"Общительность","Демонстративность":"Демонстративность","Устойчивость":"Эмоциональная устойчивость","Чувствительность":"Чувствительность","Настойчивость":"Настойчивость","Эмоциональность":"Эмоциональность"};
 document.getElementById("result").style.display="block";
 document.getElementById("result").innerHTML="<h2>Результат</h2>"+best.map(x=>`<p><b>${names[x[0]]}</b>: ${x[1]} из 4</p>`).join("")+
 "<p class='small'>Чем выше показатель, тем сильнее соответствующая особенность выражена в ответах. Результат носит ознакомительный характер.</p>";
 window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
</script>
</body>
</html>
